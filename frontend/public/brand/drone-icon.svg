<!-- KFL Aviation DMS Favicon — High contrast, light/dark theme aware -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      /* Light theme (default) */
      .bg { fill: #f5f7fa; }
      .drone-body { fill: #166aa8; }
      .drone-dark { fill: #0d2235; }
      .drone-mid { fill: #46677f; }
      .rotor { fill: #166aa8; }
      .blade { stroke: #166aa8; }
      .antenna { stroke: #166aa8; }
      .antenna-dot { fill: #166aa8; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d2235; }
        .drone-body { fill: #63b3ed; }
        .drone-dark { fill: #f2f6fa; }
        .drone-mid { fill: #b7c8d7; }
        .rotor { fill: #63b3ed; }
        .blade { stroke: #63b3ed; }
        .antenna { stroke: #63b3ed; }
        .antenna-dot { fill: #63b3ed; }
      }
    </style>
  </defs>

  <!-- Rounded square background -->
  <rect class="bg" width="32" height="32" rx="6"/>

  <!-- Drone body -->
  <rect class="drone-body" x="10" y="14" width="12" height="2"/>
  <rect class="drone-dark" x="11" y="12" width="10" height="1"/>

  <!-- Rotors -->
  <rect class="rotor" x="8" y="10" width="2" height="2"/>
  <rect class="rotor" x="22" y="10" width="2" height="2"/>
  <rect class="rotor" x="8" y="22" width="2" height="2"/>
  <rect class="rotor" x="22" y="22" width="2" height="2"/>

  <!-- Rotor blades (spinning suggestion) -->
  <line class="blade" x1="7" y1="11" x2="9" y2="13" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="9" y1="11" x2="7" y2="13" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="23" y1="11" x2="21" y2="13" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="21" y1="11" x2="23" y2="13" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="7" y1="23" x2="9" y2="21" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="9" y1="23" x2="7" y2="21" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="23" y1="23" x2="21" y2="21" stroke-width="1.5" stroke-linecap="round"/>
  <line class="blade" x1="21" y1="23" x2="23" y2="21" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Landing gear -->
  <rect class="drone-dark" x="9" y="16" width="1" height="2"/>
  <rect class="drone-dark" x="22" y="16" width="1" height="2"/>

  <!-- Antenna -->
  <line class="antenna" x1="15" y1="12" x2="15" y2="10" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="antenna-dot" cx="15" cy="9.5" r="1"/>
</svg>
