server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cache policy
    # ------------
    # Every deploy rebuilds the frontend, so chunk hashes change. The shell
    # (index.html) names those hashes, so it must always revalidate; the hashed
    # files themselves never change and can be cached forever. Without this,
    # browsers heuristically reuse an old shell and request chunk hashes from a
    # previous build, which no longer exist.
    #
    # A miss under /assets/ must return 404 rather than falling through to
    # /index.html: the shell is text/html, so a module-script request for it
    # fails with "'text/html' is not a valid JavaScript MIME type" and hides the
    # real cause (a stale shell asking for a deleted chunk).
    #
    # nginx stops inheriting add_header directives once a location declares its
    # own, so CSP and nosniff are repeated in each block that sets a header.

    # Content-addressed build output: cache immutably, never fall back.
    location /assets/ {
        try_files $uri =404;
        # No `always`: a 404 must not inherit a year-long cache, otherwise a
        # chunk requested during a deploy race would stay broken until evicted.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # The app shell: revalidate on every load so new chunk hashes are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        client_max_body_size 11m;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
}