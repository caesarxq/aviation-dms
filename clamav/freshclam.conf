# Custom freshclam.conf - no DatabaseOwner to avoid privilege switching in read-only container
DatabaseDirectory /var/lib/clamav
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 0
LogTime yes
LogVerbose yes
LogSyslog no
LogRotate yes
DatabaseMirror database.clamav.net
MaxAttempts 5
ScriptedUpdates yes
CompressLocalDatabase no
Bytecode yes
