# ClamAV clamd configuration for Aviation DMS internal scanner
# INSTREAM endpoint for backend malware scanning (fail-closed)

LogFile /dev/null
LogTime yes
LogSyslog no
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
FixStaleSocket yes
TCPSocket 3310
StreamMaxLength 26214400
MaxConnectionQueueLength 15
IdleTimeout 30
MaxThreads 4
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
