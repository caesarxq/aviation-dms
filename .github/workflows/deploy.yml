name: Aviation DMS Build, Test, Staging Deploy, and Production Promotion

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      approve_staging:
        description: 'Authorize updating live staging'
        required: false
        default: false
        type: boolean
      approve_production:
        description: 'Authorize production deployment after staging validation'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  STAGING_HOST: 10.20.4.234
  STAGING_USER: ubuntu
  STAGING_DIR: /opt/kfl-aviation-dms-staging
  BASTION_HOST: 145.241.152.126
  BASTION_USER: ubuntu
  # Production instance private IP — Caddy on bastion connects over the VCN
  PROD_HOST: 10.20.1.69

permissions:
  contents: read

jobs:
  build:
    name: Build Docker images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.set-tag.outputs.tag }}
      frontend_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          TAG="canonical-${{ github.sha }}-$(date +%Y%m%dT%H%M%SZ)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

      - name: Report image build result
        run: |
          echo "Backend: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request builds are not published to the registry."
          else
            echo "Images were published to the registry."
          fi

  test-backend:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest -x -q --ignore=scripts/test_instream.py

  test-frontend:
    name: Run frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test -- --run

      - name: Run frontend TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

  graphify-extract:
    name: Extract code knowledge graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Graphify CLI
        run: pip install graphifyy

      - name: Extract backend graph
        run: graphify extract backend/ --code-only
        working-directory: ${{ github.workspace }}

      - name: Extract frontend graph
        run: graphify extract frontend/src/ --code-only
        working-directory: ${{ github.workspace }}

      - name: Cluster both graphs for reports
        run: |
          graphify cluster-only ${{ github.workspace }}/backend
          graphify cluster-only ${{ github.workspace }}/frontend/src
        working-directory: ${{ github.workspace }}

      - name: Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphify-graphs
          path: |
            backend/graphify-out/
            frontend/src/graphify-out/
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: [build, test-backend, test-frontend]
    if: github.event_name == 'workflow_dispatch' && inputs.approve_staging == true
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: aviation-dms-staging-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ needs.build.outputs.backend_tag }}
      CR_PAT: ${{ secrets.CR_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_staging
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_staging
          ssh-keyscan -H ${{ env.BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Sync staging deployment files
        run: |
          scp -i ~/.ssh/id_staging \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            docker-compose.yml docker-compose.staging.yml scripts/deploy-staging.sh \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:/tmp/

          ssh -i ~/.ssh/id_staging \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "sudo install -m 0644 /tmp/docker-compose.yml ${{ env.STAGING_DIR }}/docker-compose.yml && \
             sudo install -m 0644 /tmp/docker-compose.staging.yml ${{ env.STAGING_DIR }}/docker-compose.staging.yml && \
             sudo install -d -m 0755 ${{ env.STAGING_DIR }}/scripts && \
             sudo install -m 0755 /tmp/deploy-staging.sh ${{ env.STAGING_DIR }}/scripts/deploy-staging.sh"

      - name: Authenticate staging host to GHCR
        run: |
          printf '%s' "$CR_PAT" | ssh -i ~/.ssh/id_staging \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "sudo docker login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin"

      - name: Deploy tested images to staging
        run: |
          ssh -i ~/.ssh/id_staging \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "cd ${{ env.STAGING_DIR }} && \
             REGISTRY='${{ env.REGISTRY }}' REPO_NAME='${{ github.repository }}' \
             ./scripts/deploy-staging.sh '$IMAGE_TAG'"

      - name: Verify staging health
        run: |
          ssh -i ~/.ssh/id_staging \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "for service in backend upload-validator clamd frontend; do \
               name=\"kfl-aviation-dms-staging-\${service}-1\"; \
               status=\$(sudo docker inspect --format='{{.State.Health.Status}}' \"\$name\"); \
               echo \"\$service: \$status\"; \
               test \"\$status\" = healthy || exit 1; \
             done"

      - name: Verify public staging HTTPS
        run: curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 https://stage.kfl.ke/ -o /dev/null

  promote-to-production:
    name: Promote to production (requires explicit staging and production approvals)
    needs: [deploy-staging, build]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.approve_staging == true && inputs.approve_production == true
    runs-on: ubuntu-latest
    concurrency:
      group: aviation-dms-production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://roc.kfl.ke
    env:
      IMAGE_TAG: ${{ needs.build.outputs.backend_tag }}
      CR_PAT: ${{ secrets.CR_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_prod
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_prod
          ssh-keyscan -H ${{ env.BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Require production backup preflight
        run: |
          ssh -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }} \
            "sudo test -x /opt/kfl-aviation-dms-prod/scripts/full-stack-backup-prod.sh || { echo 'BLOCKED: production-specific backup script is not installed; no deployment performed'; exit 1; }"

      - name: Sync production deployment files
        run: |
          scp -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            docker-compose.yml docker-compose.prod.yml scripts/deploy-prod.sh \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }}:/tmp/

          ssh -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }} \
            "sudo install -m 0644 /tmp/docker-compose.yml /opt/kfl-aviation-dms-prod/docker-compose.yml && \
             sudo install -m 0644 /tmp/docker-compose.prod.yml /opt/kfl-aviation-dms-prod/docker-compose.prod.yml && \
             sudo install -d -m 0755 /opt/kfl-aviation-dms-prod/scripts && \
             sudo install -m 0755 /tmp/deploy-prod.sh /opt/kfl-aviation-dms-prod/scripts/deploy-prod.sh"

      - name: Authenticate production host to GHCR
        run: |
          printf '%s' "$CR_PAT" | ssh -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }} \
            "sudo docker login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin"

      - name: Deploy staging-validated image to production
        run: |
          ssh -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }} \
            "cd /opt/kfl-aviation-dms-prod && \
             REGISTRY='${{ env.REGISTRY }}' REPO_NAME='${{ github.repository }}' \
             ./scripts/deploy-prod.sh '$IMAGE_TAG'"

      - name: Verify public production HTTPS
        run: curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 https://roc.kfl.ke/ -o /dev/null
