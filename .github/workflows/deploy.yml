name: Aviation DMS Build, Test, Staging Deploy, and Production Promotion

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy (leave empty to build new)'
        required: false
        default: ''
      approve_staging:
        description: 'Authorize deployment to live staging'
        required: false
        default: false
        type: boolean
      approve_production:
        description: 'Approve production deployment'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  # Owner-confirmed: roc-dis is one VM with both the bastion and staging addresses.
  # Staging is deployed directly to this shared host (no separate staging instance).
  STAGING_HOST: 145.241.152.126
  STAGING_USER: ubuntu
  STAGING_DIR: /opt/kfl-aviation-dms-staging
  BASTION_HOST: 145.241.152.126
  BASTION_USER: ubuntu
  # Single host-key pin for the shared bastion/staging VM (roc-dis).
  ROC_DIS_HOST_KEY_FINGERPRINT: "SHA256:8gJYtzepz5my3l6wpKYHcF2s+BUpTgbEOCPuJRqyoe8"
  # Production instance private IP — set via GitHub secret or environment
  # Obtain from: OCI console instance details
  PROD_HOST: ${{ secrets.PROD_HOST || 'prod.kfl.ke' }}

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.set-tag.outputs.tag }}
      frontend_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          TAG="canonical-${{ github.sha }}-$(date +%Y%m%dT%H%M%SZ)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest,mode=max

      - name: Verify images in registry
        run: |
          echo "Backend: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}"

  test-backend:
    name: Run backend tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest -x -q --ignore=scripts/test_instream.py --ignore=tests/test_seed_audit_findings.py

  test-frontend:
    name: Run frontend tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test -- --run

      - name: Run frontend TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

  graphify-extract:
    name: Extract code knowledge graph
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Graphify CLI
        run: pip install graphifyy

      - name: Extract backend graph
        run: graphify extract backend/ --code-only
        working-directory: ${{ github.workspace }}

      - name: Extract frontend graph
        run: graphify extract frontend/src/ --code-only
        working-directory: ${{ github.workspace }}

      - name: Cluster both graphs for reports
        run: |
          graphify cluster-only ${{ github.workspace }}/backend
          graphify cluster-only ${{ github.workspace }}/frontend/src
        working-directory: ${{ github.workspace }}

      - name: Upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphify-graphs
          path: |
            backend/graphify-out/
            frontend/src/graphify-out/
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'workflow_dispatch' && inputs.approve_staging == true
    needs: [test-backend, test-frontend, build]
    runs-on: [self-hosted, staging]
    environment: staging
    env:
      IMAGE_TAG: ${{ needs.build.outputs.backend_tag }}
      DMS_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          REMOTE_DEPLOY_DIR="/tmp/kfl-aviation-dms-${IMAGE_TAG}"

          echo '${{ secrets.CR_PAT }}' | sudo docker login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin
          mkdir -m 700 -p '${REMOTE_DEPLOY_DIR}/scripts'

          cp docker-compose.yml '${REMOTE_DEPLOY_DIR}/'
          cp docker-compose.staging.yml '${REMOTE_DEPLOY_DIR}/'
          cp scripts/deploy-staging.sh '${REMOTE_DEPLOY_DIR}/scripts/'

          sudo install -D -o root -g root -m 0644 '${REMOTE_DEPLOY_DIR}/docker-compose.yml' '${{ env.STAGING_DIR }}/docker-compose.yml'
          sudo install -D -o root -g root -m 0644 '${REMOTE_DEPLOY_DIR}/docker-compose.staging.yml' '${{ env.STAGING_DIR }}/docker-compose.staging.yml'
          sudo install -D -o root -g root -m 0755 '${REMOTE_DEPLOY_DIR}/scripts/deploy-staging.sh' '${{ env.STAGING_DIR }}/scripts/deploy-staging.sh'
          rm -f '${REMOTE_DEPLOY_DIR}/docker-compose.yml' '${REMOTE_DEPLOY_DIR}/docker-compose.staging.yml' '${REMOTE_DEPLOY_DIR}/scripts/deploy-staging.sh'
          rmdir '${REMOTE_DEPLOY_DIR}/scripts' '${REMOTE_DEPLOY_DIR}'

          cd ${{ env.STAGING_DIR }}
          ./scripts/deploy-staging.sh $IMAGE_TAG

      - name: Verify staging health
        run: |
          backend_image=$(sudo docker inspect --format='{{.Config.Image}}' kfl-aviation-dms-staging-backend-1)
          frontend_image=$(sudo docker inspect --format='{{.Config.Image}}' kfl-aviation-dms-staging-frontend-1)
          test "$backend_image" = "kfl-aviation-dms-backend:${IMAGE_TAG}"
          test "$frontend_image" = "kfl-aviation-dms-frontend:${IMAGE_TAG}"
          sudo docker ps --filter name=kfl-aviation-dms-staging --format 'table {{.Names}}\t{{.Status}}'

          curl --fail --silent --show-error --output /dev/null \
            --write-out 'Staging HTTPS root HTTP %{http_code}\n' \
            https://stage.kfl.ke/

  promote-to-production:
    name: Promote to production (requires approval)
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.approve_staging == true && inputs.approve_production == true
    needs: [deploy-staging, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://roc.kfl.ke
    env:
      IMAGE_TAG: ${{ needs.build.outputs.backend_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check production approval
        run: |
          if [ "${{ inputs.environment }}" != "production" ] || \
             [ "${{ inputs.approve_staging }}" != "true" ] || \
             [ "${{ inputs.approve_production }}" != "true" ]; then
            echo "ERROR: Production deployment requires explicit approval"
            echo "Set approve_production=true in workflow_dispatch or use the production environment protection rule"
            exit 1
          fi

      - name: Set up pinned SSH trust
        env:
          PRODUCTION_HOST_KEY: ${{ secrets.PRODUCTION_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${PRODUCTION_HOST_KEY}" ]; then
            echo "ERROR: PRODUCTION_HOST_KEY is not set." >&2
            echo "Add the production host's public key line (as it appears in known_hosts)" >&2
            echo "as a repository secret. Refusing to promote over an unverified host key." >&2
            exit 1
          fi

          printf '%s\n' "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_bastion
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_prod
          chmod 600 ~/.ssh/id_bastion ~/.ssh/id_prod

          # Bastion: prove the presented key matches the fingerprint already
          # pinned for this shared VM, instead of trusting whatever answers.
          scan=$(ssh-keyscan -T 10 -t ed25519 "${{ env.BASTION_HOST }}" 2>/dev/null || true)
          if [ -z "${scan}" ]; then
            echo "ERROR: could not read the bastion host key" >&2
            exit 1
          fi
          actual=$(printf '%s\n' "${scan}" | ssh-keygen -lf - | awk '{print $2}' | head -1)
          if [ "${actual}" != "${{ env.ROC_DIS_HOST_KEY_FINGERPRINT }}" ]; then
            echo "ERROR: bastion host key fingerprint mismatch (got ${actual})" >&2
            exit 1
          fi
          printf '%s\n' "${scan}" > ~/.ssh/known_hosts_bastion

          printf '%s\n' "${PRODUCTION_HOST_KEY}" > ~/.ssh/known_hosts_prod
          chmod 600 ~/.ssh/known_hosts_bastion ~/.ssh/known_hosts_prod
          echo "Pinned SSH trust configured for the bastion and the production host"

      - name: Verify production backup helper
        run: |
          ssh -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_prod" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i ~/.ssh/id_bastion -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_bastion -o GlobalKnownHostsFile=/dev/null -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }} \
            "test -f /opt/kfl-aviation-dms-prod/scripts/full-stack-backup.sh && echo 'production backup helper: present'"

      - name: Promote image to production
        run: |
          ssh -i ~/.ssh/id_prod \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_prod" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i ~/.ssh/id_bastion -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_bastion -o GlobalKnownHostsFile=/dev/null -W %h:%p ${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
            ${{ env.BASTION_USER }}@${{ env.PROD_HOST }} \
            "./scripts/promote-to-production.sh $IMAGE_TAG"
