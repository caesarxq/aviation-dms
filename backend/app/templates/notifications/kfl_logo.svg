<!-- KFL Aviation DMS Logo — inline SVG for email -->
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="48" viewBox="0 0 150 48">
  <defs>
    <linearGradient id="kfl-wing-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1b7abf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#166aa8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Wing / document motif -->
  <path d="M 12 6 L 12 38 L 46 38 L 46 14 L 80 14 L 80 6 Z" fill="#0d2235" />
