# ============================================================================
# Aviation DMS — Docker Compose Production Override
# ============================================================================
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Production runs on OCI with production settings and proper domain.
# ============================================================================

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      DEV_MODE: "false"
      FLIGHT_RELEASE_ENABLED: "false"
      SESSION_COOKIE_SECURE: "true"
      AUTH_ALLOWED_ORIGINS: "https://roc.kfl.ke"
      CORS_ORIGINS: "https://roc.kfl.ke"
      PUBLIC_APP_URL: "https://roc.kfl.ke"
      HOST: "0.0.0.0"
      PORT: "8000"
      DMS_TRUSTED_FRONTEND_IP: "10.0.0.10"
      DMS_UPLOAD_STORAGE_QUOTA_BYTES: "30000000000"
      NOTIFICATION_ENABLED: "true"
      SESSION_TTL_SECONDS: "28800"
      SESSION_ABSOLUTE_MAX_SECONDS: "86400"
      KFL_BOOTSTRAP_TOKEN_FILE: /run/secrets/kfl_bootstrap_token
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
      nproc:
        soft: 256
        hard: 256

  upload-validator:
    mem_limit: 1g
    pids_limit: 64
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
      nproc:
        soft: 64
        hard: 64

  clamd:
    mem_limit: 2g
    pids_limit: 128
    cpus: 2.0
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
      nproc:
        soft: 128
        hard: 128

  frontend:
    ports:
      - "8080:80"

  https_proxy:
    environment:
      DMS_HOSTNAME: "roc.kfl.ke"
      ACME_EMAIL: "admin@kfl.ke"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dms_data: {}
  caddy_data: {}
  caddy_config: {}
  clamd_data: {}
