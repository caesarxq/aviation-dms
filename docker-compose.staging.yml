# ============================================================================
# Aviation DMS — Docker Compose Staging Override
# ============================================================================
# Use with: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# Staging runs on localhost with dev mode enabled.
# ============================================================================

services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEV_MODE: "true"
      FLIGHT_RELEASE_ENABLED: "false"
      SESSION_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      PUBLIC_APP_URL: "http://localhost:8080"
      HOST: "0.0.0.0"
      PORT: "8000"
      DMS_TRUSTED_FRONTEND_IP: "172.31.254.3"
      DMS_UPLOAD_STORAGE_QUOTA_BYTES: "1073741824"
      NOTIFICATION_ENABLED: "false"
      SESSION_TTL_SECONDS: "3600"
      SESSION_ABSOLUTE_MAX_SECONDS: "7200"
      KFL_BOOTSTRAP_TOKEN_FILE: /run/secrets/kfl_bootstrap_token

  upload-validator:
    expose:
      - "9100"

  clamd:
    expose:
      - "3310"

  frontend:
    ports:
      - "127.0.0.1:8080:80"

  https_proxy:
    # Staging uses Caddy with self-signed certs for local HTTPS testing
    environment:
      DMS_HOSTNAME: "localhost"
      ACME_EMAIL: "admin@localhost.local"
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8081:80"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dms_data: {}
  caddy_data: {}
  caddy_config: {}
  clamd_data: {}
