# ============================================================================
# Aviation DMS — Docker Compose Staging Override
# ============================================================================
# Use with docker-compose.yml for cloud staging; bastion Caddy terminates TLS.
# Local HTTPS testing is opt-in through the base compose local-https profile.
# ============================================================================

services:
  backend:
    environment:
      DEV_MODE: "false"
      FLIGHT_RELEASE_ENABLED: "false"
      SESSION_COOKIE_SECURE: "true"
      AUTH_ALLOWED_ORIGINS: "http://localhost:5173,https://stage.kfl.ke"
      CORS_ORIGINS: "http://localhost:5173,https://stage.kfl.ke"
      PUBLIC_APP_URL: "https://stage.kfl.ke"
      HOST: "0.0.0.0"
      PORT: "8000"
      DMS_TRUSTED_FRONTEND_IP: "172.31.254.3"
      DMS_UPLOAD_STORAGE_QUOTA_BYTES: "1073741824"
      NOTIFICATION_ENABLED: "true"
      INVITE_EMAIL_ENABLED: "true"
      SESSION_TTL_SECONDS: "3600"
      SESSION_ABSOLUTE_MAX_SECONDS: "7200"
      KFL_BOOTSTRAP_TOKEN_FILE: /run/secrets/kfl_bootstrap_token
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      ZOHO_CLIENT_ID_FILE: /run/secrets/zoho_client_id
      ZOHO_CLIENT_SECRET_FILE: /run/secrets/zoho_client_secret
      ZOHO_REFRESH_TOKEN_FILE: /run/secrets/zoho_refresh_token
      ZOHO_BUGTRACKER_PORTAL: "${ZOHO_BUGTRACKER_PORTAL:-kfldotke}"
      ZOHO_BUGTRACKER_PORTAL_ID: "${ZOHO_BUGTRACKER_PORTAL_ID:-}"
      ZOHO_BUGTRACKER_PROJECT_ID: "${ZOHO_BUGTRACKER_PROJECT_ID:-2730932000000114802}"
    secrets:
      - zoho_client_id
      - zoho_client_secret
      - zoho_refresh_token
    volumes:
      - dms_data:/app/data
      - /opt/kfl-aviation-dms-staging/secrets/smtp_pass:/run/secrets/smtp_pass:ro

  upload-validator:
    expose:
      - "9100"

  clamd:
    expose:
      - "3310"

secrets:
  zoho_client_id:
    file: ${ZOHO_CLIENT_ID_SECRET_FILE:?Set ZOHO_CLIENT_ID_SECRET_FILE to a protected host-side secret file}
  zoho_client_secret:
    file: ${ZOHO_CLIENT_SECRET_SECRET_FILE:?Set ZOHO_CLIENT_SECRET_SECRET_FILE to a protected host-side secret file}
  zoho_refresh_token:
    file: ${ZOHO_REFRESH_TOKEN_SECRET_FILE:?Set ZOHO_REFRESH_TOKEN_SECRET_FILE to a protected host-side secret file}

volumes:
  dms_data: {}
  clamd_data: {}
