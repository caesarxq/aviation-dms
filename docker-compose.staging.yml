# ============================================================================
# Aviation DMS — Docker Compose Staging Override
# ============================================================================
# Use with: docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d
# Staging is routed through the bastion reverse proxy; CI supplies host ports 8001/8081.
# Compose deployment uses the same database, upload validator, and ClamAV services.

services:
  backend:
    environment:
      DEV_MODE: "true"
      FLIGHT_RELEASE_ENABLED: "false"
      SESSION_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: "http://localhost:5173,https://stage.kfl.ke"
      CORS_ORIGINS: "http://localhost:5173,https://stage.kfl.ke"
      PUBLIC_APP_URL: "https://stage.kfl.ke"
      HOST: "0.0.0.0"
      PORT: "8000"
      DMS_TRUSTED_FRONTEND_IP: "10.20.4.234"
      DMS_UPLOAD_STORAGE_QUOTA_BYTES: "1073741824"
      NOTIFICATION_ENABLED: "false"
      SESSION_TTL_SECONDS: "3600"
      SESSION_ABSOLUTE_MAX_SECONDS: "7200"
      KFL_BOOTSTRAP_TOKEN_FILE: /run/secrets/kfl_bootstrap_token

  upload-validator:
    expose:
      - "9100"

  clamd:
    expose:
      - "3310"

volumes:
  dms_data: {}
  caddy_data: {}
  caddy_config: {}
  clamd_data: {}
